name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      CARGO_TERM_COLOR: always
      # Speed up exhaustive DP oracle tests while retaining test debug assertions.
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      # Override the local benchmark's target-cpu=native for distributable builds.
      RUSTFLAGS: -C target-cpu=generic
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Install macOS OpenMP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp
          echo "CFLAGS=-I$(brew --prefix libomp)/include" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - name: Lint all targets
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee /tmp/oofft-clippy.log; then
            python3 - <<'PYTHON'
          from pathlib import Path
          message = Path('/tmp/oofft-clippy.log').read_text()[-6000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Rust build or lint failed::' + message)
          PYTHON
            exit 1
          fi
      - run: cargo test --locked --all-targets
      - name: Test scalar fallback without SIMD dependency
        run: cargo test --locked --no-default-features --test energy --test energy_vienna
      - name: Check benchmark helpers
        if: runner.os == 'Linux'
        run: |
          python3 -m py_compile benchmarks/classic/*.py benchmarks/ddg/*.py benchmarks/summary/*.py scripts/*.py
          python3 benchmarks/classic/test_verify.py
          python3 benchmarks/classic/test_timeout.py
      - name: Verify source package
        run: cargo package --locked
      - name: Build release binaries
        run: cargo build --locked --release --bin oofft --bin oofft-index --bin oofft-ddg
      - name: Package and smoke-test binaries
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oofft-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
