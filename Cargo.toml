[package]
name = "ooff"
default-run = "ooff"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "ASO candidate-site discovery with explicit search scope"
license = "MIT"
repository = "https://github.com/barneyhill/ooff"
readme = "README.md"
keywords = ["bioinformatics", "aso", "alignment", "off-target"]
categories = ["science", "command-line-utilities"]
include = ["src/**", "tests/**", "fixtures/**", "benchmarks/engine_driver.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libsais = "=0.2.0"
memmap2 = "=0.9.11"
rustc-hash = "=2.1.3"

[profile.release]
debug = 1
